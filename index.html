<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080a">
  <meta name="description" content="複数の回転層と発光粒子が動き続ける、放電風の全画面アニメーション。">
  <title>放電アニメーション</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #05080a;
      --night: #0a1012;
      --steel: #9eaaa4;
      --steel-dim: #53615f;
      --paper: #f3e8c9;
      --amber: #e8b52a;
      --hot: #ff5c33;
      --pulse: rgba(232,181,42,.72);
      --hair: rgba(234,229,216,.17);
      --measure: min(121vmin, 104rem);
      --ease-linear: linear;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--void);
      color: var(--paper);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(232,181,42,.10) 0, rgba(255,92,51,.035) 17%, transparent 43%),
        radial-gradient(ellipse at 50% 54%, #0b1112 0, var(--void) 72%);
    }
    .stage::before, .stage::after { position: absolute; inset: 0; pointer-events: none; content: ""; }
    .stage::before {
      z-index: 8;
      opacity: .20;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(234,229,216,.08) 3px 4px);
      mix-blend-mode: screen;
    }
    .stage::after {
      z-index: 9;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(5,8,10,.38) 72%, rgba(5,8,10,.9) 120%);
    }
    .field-grid {
      position: absolute;
      inset: -20%;
      opacity: .13;
      background-image:
        linear-gradient(rgba(158,170,164,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(158,170,164,.075) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(ellipse at center, #000 0, transparent 67%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0, transparent 67%);
      animation: grid-drift 38s linear infinite;
    }
    .scan-sweep {
      position: absolute;
      z-index: 2;
      inset: -50% -15%;
      opacity: .18;
      background: linear-gradient(180deg, transparent 46%, rgba(232,181,42,.10) 49.7%, rgba(255,92,51,.22) 50%, rgba(232,181,42,.08) 50.3%, transparent 54%);
      transform: translateY(-80%);
      animation: scan 8.8s cubic-bezier(.55,0,.45,1) infinite;
      pointer-events: none;
    }
    #sparks {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .core {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: var(--measure);
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
      isolation: isolate;
    }
    .core-glow {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,92,51,.075) 0, rgba(232,181,42,.055) 29%, transparent 68%);
      filter: blur(12px);
      animation: breathe 4.4s ease-in-out infinite alternate;
    }
    .beamfield {
      position: absolute;
      inset: -11%;
      border-radius: 50%;
      opacity: .29;
      background: repeating-conic-gradient(from 0deg, transparent 0deg 4.8deg, rgba(232,181,42,.16) 5deg 5.18deg, transparent 5.36deg 9deg, rgba(255,92,51,.11) 9.08deg 9.22deg, transparent 9.4deg 14deg);
      mask-image: radial-gradient(circle, transparent 0 31%, #000 39%, #000 54%, transparent 73%);
      -webkit-mask-image: radial-gradient(circle, transparent 0 31%, #000 39%, #000 54%, transparent 73%);
      animation: spin-cw 31s linear infinite;
      mix-blend-mode: screen;
    }
    .beamfield--inner {
      inset: 13%;
      opacity: .28;
      background: repeating-conic-gradient(from 7deg, transparent 0deg 8deg, rgba(255,92,51,.21) 8.2deg 8.36deg, transparent 8.55deg 17deg);
      mask-image: radial-gradient(circle, transparent 0 42%, #000 44%, #000 68%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle, transparent 0 42%, #000 44%, #000 68%, transparent 75%);
      animation-name: spin-ccw;
      animation-duration: 22s;
    }
    .instrument {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 18px rgba(232,181,42,.16));
    }
    .rot { transform-box: view-box; transform-origin: 300px 300px; }
    .rot--a { animation: spin-cw 74s linear infinite; }
    .rot--b { animation: spin-ccw 48s linear infinite; }
    .rot--c { animation: spin-cw 32s linear infinite; }
    .rot--d { animation: spin-ccw 21s linear infinite; }
    .hair { fill: none; stroke: rgba(158,170,164,.33); stroke-width: .8; }
    .hair--hot { stroke: rgba(255,92,51,.38); stroke-width: 1.1; }
    .dash { fill: none; stroke: rgba(232,181,42,.36); stroke-width: 1; stroke-dasharray: 1 5; }
    .tk { stroke: rgba(158,170,164,.36); stroke-width: .8; }
    .tk--ultra { stroke: rgba(158,170,164,.26); stroke-width: .65; }
    .tk--ultra2 { stroke: rgba(232,181,42,.62); stroke-width: 1.1; }
    .tk--fine { stroke: rgba(158,170,164,.34); stroke-width: .8; }
    .tk--thin { stroke: rgba(158,170,164,.40); stroke-width: .8; }
    .tk--mid { stroke: rgba(243,232,201,.74); stroke-width: 1.45; }
    .tk--inner { stroke: rgba(232,181,42,.67); stroke-width: 1.2; }
    .tk--arm { stroke: rgba(255,92,51,.82); }
    .tk--arm2 { stroke: rgba(232,181,42,.62); }
    .band { fill: none; stroke: rgba(255,92,51,.25); stroke-width: 8; }
    .band-thin { fill: none; stroke: rgba(255,92,51,.88); stroke-width: 1.1; }
    .hatch { stroke: rgba(255,92,51,.85); stroke-width: 1.5; }
    .arc-seg { fill: none; stroke: rgba(232,181,42,.72); stroke-width: 1.3; stroke-linecap: round; }
    .arc-tick { fill: none; stroke: rgba(243,232,201,.55); stroke-width: .8; }
    .lens { fill: rgba(5,8,10,.74); stroke: rgba(232,181,42,.58); stroke-width: 1.4; }
    .lens--thin { fill: none; stroke: rgba(255,92,51,.50); stroke-width: .9; stroke-dasharray: 2 4; }
    .needle { transform-box: view-box; transform-origin: 300px 300px; animation: needle-sweep 2.7s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .needle-fill { fill: var(--paper); stroke: var(--hot); stroke-width: .8; filter: drop-shadow(0 0 5px rgba(255,92,51,.8)); }
    .needle-tail { fill: var(--hot); opacity: .72; }
    .hub-ring { fill: var(--void); stroke: var(--amber); stroke-width: 1.5; }
    .hub { fill: var(--paper); }

    .blades { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .blades i {
      position: absolute;
      top: 50%; left: 50%;
      display: block;
      width: 1px;
      height: 43%;
      transform: translate(-50%,-50%) rotate(var(--a));
      transform-origin: center;
      opacity: .34;
      background: linear-gradient(180deg, transparent 0, rgba(255,92,51,.72) 27%, rgba(232,181,42,.22) 53%, transparent 100%);
      animation: blade-pulse var(--t) ease-in-out infinite alternate;
      animation-delay: calc(var(--t) * -.47);
    }
    .orbits { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .orbits i {
      position: absolute;
      top: 50%; left: 50%;
      display: block;
      width: calc(var(--r) * 2);
      height: calc(var(--r) * .76);
      border: 1px solid rgba(158,170,164,.18);
      border-radius: 50%;
      transform: translate(-50%,-50%) rotate(-31deg);
      animation: orbit-spin var(--spin) linear infinite var(--dir);
    }
    .orbits i:nth-child(2n) { border-color: rgba(232,181,42,.19); }
    .orbits i:nth-child(3n) { border-style: dashed; border-color: rgba(255,92,51,.20); }
    .orbits i::before, .orbits i::after {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      content: "";
      background: var(--paper);
      box-shadow: 0 0 9px 2px rgba(232,181,42,.76);
    }
    .orbits i::before { top: -3px; left: 50%; }
    .orbits i::after { right: 12%; bottom: 4%; width: 3px; height: 3px; background: var(--hot); box-shadow: 0 0 8px 2px rgba(255,92,51,.72); }

    .columns {
      position: absolute;
      z-index: 5;
      display: flex;
      gap: clamp(2px,.32vw,5px);
      width: clamp(4.5rem, 11vw, 10rem);
      height: clamp(14rem, 46vh, 29rem);
      opacity: .34;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .columns--left { left: clamp(.7rem,3vw,3rem); bottom: 6vh; }
    .columns--right { right: clamp(.7rem,3vw,3rem); top: 6vh; transform: rotate(180deg); opacity: .24; }
    .col { display: flex; flex: 1; min-width: 0; height: 100%; flex-direction: column; gap: 2px; }
    .col i { position: relative; display: block; flex: 1; min-height: 1px; overflow: hidden; }
    .col i::before {
      position: absolute;
      top: 0; left: 0;
      display: block;
      width: var(--h);
      height: 100%;
      content: "";
      background: linear-gradient(90deg, var(--amber), rgba(255,92,51,.68));
      opacity: .25;
      transform-origin: left center;
      animation: bar-flare var(--t) ease-in-out infinite alternate;
      animation-delay: calc(var(--d) * -1);
    }
    .columns--right .col i::before { left: auto; right: 0; transform-origin: right center; }

    .blades, .orbits, .columns, .beamfield, .core-glow, .field-grid, .scan-sweep { will-change: transform, opacity; }
    .is-paused * { animation-play-state: paused !important; }

    @keyframes spin-cw { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(-31deg); }
      to { transform: translate(-50%,-50%) rotate(329deg); }
    }
    @keyframes needle-sweep {
      from { transform: rotate(-43deg); }
      to { transform: rotate(43deg); }
    }
    @keyframes blade-pulse { from { opacity: .08; transform: translate(-50%,-50%) rotate(var(--a)) scaleY(.64); } to { opacity: .58; transform: translate(-50%,-50%) rotate(var(--a)) scaleY(1.06); } }
    @keyframes bar-flare { from { opacity: .08; transform: scaleX(.22); } to { opacity: .58; transform: scaleX(1); } }
    @keyframes breathe { from { opacity: .55; transform: scale(.92); } to { opacity: 1; transform: scale(1.07); } }
    @keyframes grid-drift { from { transform: rotate(0deg) translate3d(0,0,0); } to { transform: rotate(5deg) translate3d(22px,14px,0); } }
    @keyframes scan { 0% { transform: translateY(-80%); } 50% { transform: translateY(0); } 100% { transform: translateY(80%); } }

    @media (max-width: 40rem) {
      :root { --measure: min(135vmin, 104rem); }
      .columns { width: 3.5rem; height: 34vh; opacity: .26; }
      .columns--left { left: .25rem; bottom: 5vh; }
      .columns--right { right: .25rem; top: 5vh; }
      .beamfield { opacity: .20; }
      .beamfield--inner { opacity: .18; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-play-state: paused !important; scroll-behavior: auto !important; }
      .scan-sweep { display: none; }
    }
    @media print {
      body, .stage { background: var(--void); }
      .stage { position: relative; width: 100vw; height: 100vh; }
      #sparks { display: none; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('sparks');
      const ctx = canvas.getContext('2d', { alpha: true });
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const palette = ['232,181,42', '255,92,51', '243,232,201', '158,170,164'];
      const count = 280;
      const particles = Array.from({ length: count }, (_, i) => ({
        angle: Math.random() * Math.PI * 2,
        radius: .12 + Math.random() * .56,
        speed: .12 + Math.random() * .52,
        drift: (Math.random() - .5) * .016,
        size: .45 + Math.random() * 1.7,
        phase: Math.random() * Math.PI * 2,
        tone: i % 9 === 0 ? 1 : (i % 4 === 0 ? 2 : (i % 3 === 0 ? 3 : 0)),
        x: 0, y: 0
      }));
      let width = 0, height = 0, dpr = 1;
      let raf = 0, previous = 0, elapsed = 0;
      let lastPaint = 0;
      const frameInterval = 1000 / 30;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        particles.forEach(p => { p.x = 0; p.y = 0; });
        paint(0, 0);
      }

      function paint(dt, time) {
        if (!width || !height) return;
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';
        const cx = width * .5, cy = height * .5;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.angle += dt * .000035 * p.speed;
          p.radius += p.drift * dt * .000035;
          if (p.radius < .10) p.radius = .67;
          if (p.radius > .70) p.radius = .11;
          const pulse = .5 + .5 * Math.sin(time * .0012 + p.phase);
          const rx = Math.min(width, height) * .58 * p.radius;
          const x = cx + Math.cos(p.angle) * rx;
          const y = cy + Math.sin(p.angle) * rx * .72;
          const color = palette[p.tone];
          const alpha = .20 + pulse * (p.tone === 1 ? .63 : .42);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = `rgba(${color},${alpha})`;
          ctx.lineWidth = p.size * (p.tone === 1 ? 1.35 : .75);
          ctx.beginPath();
          ctx.moveTo(p.x || x, p.y || y);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.fillStyle = `rgba(${color},${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, p.size * (p.tone === 1 ? 1.35 : 1), 0, Math.PI * 2);
          ctx.fill();
          p.x = x; p.y = y;
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      function loop(now) {
        raf = 0;
        if (document.hidden || motion.matches) return;
        if (!previous) previous = now;
        const dt = Math.min(now - previous, 72);
        previous = now;
        elapsed += dt;
        if (now - lastPaint >= frameInterval) {
          paint(dt, elapsed);
          lastPaint = now;
        }
        raf = requestAnimationFrame(loop);
      }

      function start() {
        if (document.hidden || motion.matches || raf) return;
        previous = 0;
        lastPaint = 0;
        raf = requestAnimationFrame(loop);
      }
      function stop() {
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }

      window.addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => {
        document.documentElement.classList.toggle('is-paused', document.hidden);
        if (document.hidden) stop();
        else start();
      });
      if (motion.addEventListener) motion.addEventListener('change', () => {
        if (motion.matches) { stop(); paint(0, elapsed); }
        else start();
      });
      resize();
      start();
    })();
