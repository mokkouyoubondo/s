<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="description" content="ローレンツ・ハルヴォルセン・トーマス・レスラーの軌道を毎フレーム数値積分して描く、放電モチーフの全画面アニメーション。">
<title>放電アニメーション カオス軌道</title>
<style>
:root {
  color-scheme: dark;
  --void: #04070a;
  --steel: 158,170,164;
  --paper: 243,232,201;
  --amber: 232,181,42;
  --hot: 255,92,51;
  --ice: 126,196,214;
  --measure: min(116vmin, 96rem);
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: #04070a;
  color: rgb(var(--paper));
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.sr-only {
  position: absolute !important;
  width: 1px !important; height: 1px !important;
  padding: 0 !important; margin: -1px !important;
  overflow: hidden !important; clip: rect(0,0,0,0) !important;
  white-space: nowrap !important; border: 0 !important;
}
.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(var(--amber),.10) 0, rgba(var(--hot),.045) 16%, transparent 42%),
    radial-gradient(ellipse at 50% 52%, #0a1013 0, var(--void) 76%);
}
.stage::before, .stage::after { position: absolute; inset: 0; content: ""; pointer-events: none; }
.stage::before {
  z-index: 40;
  opacity: .15;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(var(--paper),.07) 3px 4px);
  mix-blend-mode: screen;
}
.stage::after {
  z-index: 41;
  background: radial-gradient(ellipse at center, transparent 26%, rgba(4,7,10,.44) 70%, rgba(4,7,10,.95) 121%);
}

/* ── 9,800 セルの格子面 : 明滅の周期は軌道の座標値から決まる ── */
.lattice {
  position: absolute;
  z-index: 0;
  inset: -14%;
  display: grid;
  grid-template-columns: repeat(140, 1fr);
  grid-template-rows: repeat(70, 1fr);
  gap: .4px;
  mask-image: radial-gradient(ellipse at center, #000 6%, rgba(0,0,0,.5) 46%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 6%, rgba(0,0,0,.5) 46%, transparent 80%);
}
.lattice i {
  display: block;
  background: linear-gradient(150deg, rgba(var(--amber),.55), rgba(var(--hot),.12) 56%, transparent);
  animation: cell-flicker calc(.9s + var(--m) * 5.4s) steps(2, end) infinite;
  animation-delay: calc(var(--m) * -6.4s);
}
.lattice i:nth-child(11n) { background: linear-gradient(150deg, rgba(var(--hot),.62), transparent 72%); }
.lattice i:nth-child(29n) { background: linear-gradient(150deg, rgba(var(--ice),.42), transparent 66%); }

.field-grid {
  position: absolute;
  z-index: 1;
  inset: -20%;
  opacity: .15;
  background-image:
    linear-gradient(rgba(var(--steel),.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--steel),.085) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at center, #000 0, transparent 64%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 0, transparent 64%);
  animation: grid-drift 31s linear infinite;
}

#chaos { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; pointer-events: none; }

.scan-sweep {
  position: absolute;
  z-index: 12;
  inset: -50% -15%;
  opacity: .18;
  pointer-events: none;
  background: linear-gradient(180deg, transparent 45%, rgba(var(--amber),.11) 49.6%, rgba(var(--hot),.24) 50%, rgba(var(--amber),.09) 50.4%, transparent 55%);
  animation: scan 6.8s cubic-bezier(.55,0,.45,1) infinite;
}

/* ── 中心の計器 ── */
.core {
  position: absolute;
  z-index: 6;
  left: 50%; top: 50%;
  width: var(--measure);
  aspect-ratio: 1;
  transform: translate(-50%,-50%);
}
.core-glow {
  position: absolute; inset: 5%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--hot),.10) 0, rgba(var(--amber),.07) 29%, transparent 67%);
  filter: blur(15px);
  animation: breathe 3.9s ease-in-out infinite alternate;
}
.beamfield {
  position: absolute; inset: -13%;
  border-radius: 50%;
  opacity: .30;
  background: repeating-conic-gradient(from 0deg,
    transparent 0deg 2.9deg,
    rgba(var(--amber),.17) 3deg 3.12deg,
    transparent 3.3deg 5.8deg,
    rgba(var(--hot),.12) 5.9deg 6deg,
    transparent 6.2deg 8.7deg);
  mask-image: radial-gradient(circle, transparent 0 30%, #000 38%, #000 55%, transparent 74%);
  -webkit-mask-image: radial-gradient(circle, transparent 0 30%, #000 38%, #000 55%, transparent 74%);
  animation: spin-cw 26s linear infinite;
  mix-blend-mode: screen;
}
.beamfield--inner {
  inset: 12%;
  opacity: .26;
  background: repeating-conic-gradient(from 7deg,
    transparent 0deg 5deg,
    rgba(var(--ice),.16) 5.1deg 5.24deg,
    transparent 5.4deg 10.4deg);
  mask-image: radial-gradient(circle, transparent 0 40%, #000 43%, #000 68%, transparent 76%);
  -webkit-mask-image: radial-gradient(circle, transparent 0 40%, #000 43%, #000 68%, transparent 76%);
  animation: spin-ccw 18s linear infinite;
}
.instrument {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 22px rgba(var(--amber),.16));
}
.rot { transform-box: view-box; transform-origin: 300px 300px; }
.rot--a { animation: spin-cw 88s linear infinite; }
.rot--b { animation: spin-ccw 57s linear infinite; }
.rot--c { animation: spin-cw 37s linear infinite; }
.rot--d { animation: spin-ccw 23s linear infinite; }
.rot--engrave { animation: spin-ccw 143s linear infinite; opacity: .62; }
.hair { fill: none; stroke: rgba(var(--steel),.30); stroke-width: .55; }
.hair--hot { stroke: rgba(var(--hot),.38); stroke-width: .8; }
.dash { fill: none; stroke: rgba(var(--amber),.32); stroke-width: .7; stroke-dasharray: 1 5; }
.tk { stroke: rgba(var(--steel),.30); stroke-width: .6; }
.tk--ultra { stroke: rgba(var(--steel),.20); stroke-width: .45; }
.tk--ultra2 { stroke: rgba(var(--amber),.52); stroke-width: .8; }
.tk--fine { stroke: rgba(var(--steel),.27); stroke-width: .55; }
.tk--thin { stroke: rgba(var(--steel),.33); stroke-width: .6; }
.tk--mid { stroke: rgba(var(--paper),.66); stroke-width: .95; }
.tk--inner { stroke: rgba(var(--amber),.58); stroke-width: .8; }
.tk--arm { stroke: rgba(var(--hot),.76); }
.tk--arm2 { stroke: rgba(var(--amber),.56); }
.band { fill: none; stroke: rgba(var(--hot),.20); stroke-width: 8; }
.band-thin { fill: none; stroke: rgba(var(--hot),.84); stroke-width: .9; }
.hatch { stroke: rgba(var(--hot),.80); stroke-width: 1.2; }
.arc-seg { fill: none; stroke: rgba(var(--amber),.66); stroke-width: 1; stroke-linecap: round; }
.arc-tick { fill: none; stroke: rgba(var(--paper),.46); stroke-width: .55; }
.engrave { fill: none; stroke: rgba(var(--ice),.62); stroke-width: .55; stroke-linejoin: round; }
.lens { fill: rgba(4,7,10,.55); stroke: rgba(var(--amber),.52); stroke-width: 1.2; }
.lens--thin { fill: none; stroke: rgba(var(--hot),.44); stroke-width: .7; stroke-dasharray: 2 4; }
.needle { transform-box: view-box; transform-origin: 300px 300px; }
.needle-fill { fill: rgb(var(--paper)); stroke: var(--hot); stroke-width: .7; filter: drop-shadow(0 0 6px rgba(var(--hot),.9)); }
.needle-tail { fill: var(--hot); opacity: .68; }
.hub-ring { fill: var(--void); stroke: var(--amber); stroke-width: 1.4; }
.hub { fill: rgb(var(--paper)); }

/* ── 1,700 本の光条（逆回転・長さはカオス係数）── */
.spectrum { position: absolute; inset: -5%; z-index: 5; pointer-events: none; }
.spectrum i {
  position: absolute;
  top: 50%; left: 50%;
  display: block;
  width: 1px;
  height: calc(4% + var(--m) * 26%);
  transform: translate(-50%,-50%) rotate(var(--a));
  transform-origin: center;
  background: linear-gradient(180deg, transparent 0, rgba(var(--amber),.7) 42%, rgba(var(--ice),.55) 58%, transparent 100%);
  animation: sliver calc(.8s + var(--m) * 3.6s) ease-in-out infinite alternate;
  animation-delay: calc(var(--m) * -5.5s);
}

/* ── 1,700 本の放射ブレード ── */
.blades { position: absolute; inset: 0; z-index: 5; pointer-events: none; animation: blade-turn 52s linear infinite; }
.blades i {
  position: absolute;
  top: 50%; left: 50%;
  display: block;
  width: 1px;
  height: calc(20% + var(--m) * 46%);
  transform: translate(-50%,-100%) rotate(var(--a));
  transform-origin: center bottom;
  background: linear-gradient(180deg, transparent 0, rgba(var(--hot),.36) 60%, rgba(var(--paper),.5) 96%, transparent 100%);
  animation: blade-pulse calc(.7s + var(--m) * 3.1s) ease-in-out infinite alternate;
  animation-delay: calc(var(--m) * -4.8s);
}

/* ── 周回軌道 12 基 ── */
.orbits { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
.orbits i {
  position: absolute;
  top: 50%; left: 50%;
  display: block;
  width: calc(var(--r) * 2);
  height: calc(var(--r) * .72);
  border: 1px solid rgba(var(--steel),.15);
  border-radius: 50%;
  transform: translate(-50%,-50%) rotate(-31deg);
  animation: orbit-spin calc(4.5s + var(--m) * 16s) linear infinite var(--dir);
}
.orbits i:nth-child(2n) { border-color: rgba(var(--amber),.17); }
.orbits i:nth-child(3n) { border-style: dashed; border-color: rgba(var(--hot),.19); }
.orbits i:nth-child(5n) { border-color: rgba(var(--ice),.16); }
.orbits i::before, .orbits i::after {
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  content: "";
  background: rgb(var(--paper));
  box-shadow: 0 0 10px 2px rgba(var(--amber),.72);
}
.orbits i::before { top: -3px; left: 50%; }
.orbits i::after { right: 12%; bottom: 4%; width: 3px; height: 3px; background: var(--hot); box-shadow: 0 0 8px 2px rgba(var(--hot),.7); }

/* ── 漂う 2,000 ノード（座標は軌道の値そのもの）── */
.nodes { position: absolute; z-index: 3; inset: 0; pointer-events: none; }
.nodes i {
  position: absolute;
  left: var(--x);
  top: var(--y);
  display: block;
  width: 3px; height: 3px;
  margin: -1.5px 0 0 -1.5px;
  background: rgb(var(--ice));
  box-shadow: 0 0 7px 1px rgba(var(--ice),.6);
  animation: node-pulse calc(1.4s + var(--m) * 6.2s) ease-in-out infinite alternate;
  animation-delay: calc(var(--m) * -9s);
}
.nodes i:nth-child(7n) { background: rgb(var(--amber)); box-shadow: 0 0 8px 1px rgba(var(--amber),.65); }
.nodes i:nth-child(11n) { width: 4px; height: 4px; background: rgb(var(--paper)); }

/* ── 左右のバー列 各 2,200 ── */
.columns {
  position: absolute;
  z-index: 9;
  display: flex;
  gap: clamp(.5px,.09vw,2px);
  width: clamp(3.5rem, 9vw, 8.5rem);
  height: 66vh;
  pointer-events: none;
  mix-blend-mode: screen;
}
.columns--left { left: clamp(.4rem,2.2vw,2.4rem); top: 17vh; }
.columns--right { right: clamp(.4rem,2.2vw,2.4rem); bottom: 17vh; transform: rotate(180deg); opacity: .68; }
.col { display: flex; flex: 1; min-width: 0; height: 100%; flex-direction: column; gap: .5px; }
.col i { position: relative; display: block; flex: 1; min-height: 1px; overflow: hidden; }
.col i::before {
  position: absolute;
  top: 0; left: 0;
  display: block;
  width: calc(4% + var(--m) * 92%);
  height: 100%;
  content: "";
  transform-origin: left center;
  background: linear-gradient(90deg, rgba(var(--amber),.95), rgba(var(--hot),.5));
  animation: bar-flare calc(.6s + var(--m) * 3.4s) ease-in-out infinite alternate;
  animation-delay: calc(var(--m) * -4.1s);
}
.columns--right .col i::before { left: auto; right: 0; transform-origin: right center; }

@keyframes spin-cw { to { transform: rotate(360deg); } }
@keyframes spin-ccw { to { transform: rotate(-360deg); } }
@keyframes orbit-spin {
  from { transform: translate(-50%,-50%) rotate(-31deg); }
  to { transform: translate(-50%,-50%) rotate(329deg); }
}
@keyframes blade-turn { to { transform: rotate(360deg); } }
@keyframes blade-pulse {
  from { opacity: .04; transform: translate(-50%,-100%) rotate(var(--a)) scaleY(.38); }
  to { opacity: calc(.22 + var(--m) * .48); transform: translate(-50%,-100%) rotate(var(--a)) scaleY(1.06); }
}
@keyframes sliver {
  from { opacity: .05; transform: translate(-50%,-50%) rotate(var(--a)) scaleY(.34); }
  to { opacity: calc(.18 + var(--m) * .5); transform: translate(-50%,-50%) rotate(var(--a)) scaleY(1.14); }
}
@keyframes bar-flare {
  from { opacity: .05; transform: scaleX(.12); }
  to { opacity: calc(.2 + var(--m) * .5); transform: scaleX(1); }
}
@keyframes cell-flicker {
  from { opacity: calc(.02 + var(--m) * .07); }
  to { opacity: calc(.05 + var(--m) * .58); }
}
@keyframes node-pulse {
  from { opacity: .05; transform: scale(.6); }
  to { opacity: calc(.22 + var(--m) * .62); transform: scale(1.5); }
}
@keyframes breathe { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.09); } }
@keyframes grid-drift { from { transform: rotate(0deg) translate3d(0,0,0); } to { transform: rotate(6deg) translate3d(28px,18px,0); } }
@keyframes scan { 0% { transform: translateY(-80%); } 50% { transform: translateY(0); } 100% { transform: translateY(80%); } }

.is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

@media (max-width: 40rem) {
  :root { --measure: min(138vmin, 96rem); }
  .columns { width: 2.6rem; height: 56vh; }
  .columns--left { left: .15rem; top: 22vh; }
  .columns--right { right: .15rem; bottom: 22vh; }
  .beamfield { opacity: .20; }
  .beamfield--inner { opacity: .17; }
  .lattice { mask-image: radial-gradient(ellipse at center, #000 4%, transparent 68%); -webkit-mask-image: radial-gradient(ellipse at center, #000 4%, transparent 68%); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    animation-play-state: paused !important;
  }
  .scan-sweep { display: none; }
}
@media print {
  body, .stage { background: var(--void); }
  .stage { position: relative; width: 100vw; height: 100vh; }
  #chaos, .scan-sweep { display: none; }
  @page { size: A4 portrait; margin: 0; }
}
</style>
</head>

<script>
(() => {
  'use strict';
  const SYSTEMS = [{"key":"lorenz","count":2600,"at":[0.5,0.5],"radius":0.33,"h":0.006,"sub":2,"hue":"amber","center":[0.1952,0.1937,23.542],"unit":32.4323,"fit":1.2117,"seeds":[[-10.3769,-12.5372,26.729],[-5.6604,-8.542,17.5856],[-5.2118,-8.9418,13.5794],[1.567,2.824,10.9348],[2.9163,4.941,12.9435],[-1.061,-1.9467,16.4128],[2.1933,2.5447,18.3973],[-2.2309,-3.2871,15.6608],[1.7726,3.6362,21.2067],[5.5244,4.3219,25.3602],[13.6818,10.8724,36.5827],[10.8504,15.2292,24.0628],[9.3797,12.5583,23.5305],[1.6842,0.687,21.4356],[-11.8529,-0.9087,40.5001],[4.6145,-0.1195,28.9673],[-7.4065,-0.3879,33.2448],[12.1844,12.9914,30.924],[-15.2658,-7.1427,42.8535],[-3.3093,0.042,26.5048],[9.4979,0.1439,36.9552],[-12.5383,-4.2853,39.4711],[-13.8429,-14.1317,33.8435],[-13.9662,-10.6754,37.3889],[13.4141,17.7448,28.4366],[-7.595,-11.2994,19.8143],[-7.324,-10.3672,21.0492],[-3.6867,0.6962,27.9879],[-5.7604,0.9675,31.6984],[-7.9484,1.506,35.6061],[13.2844,22.0206,21.3934],[12.0498,2.2469,39.9732],[15.9669,15.5355,37.7158],[9.2124,16.7142,13.8177],[-13.8716,-19.0764,28.0451],[5.4159,9.9274,11.0366],[5.2273,8.0428,17.8833],[6.6402,9.6273,19.26],[-11.8978,-16.2196,25.9109],[-10.7588,-16.8201,20.8814]]},{"key":"halvorsen","count":1200,"at":[0.5,0.5],"radius":0.175,"h":0.004,"sub":2,"hue":"hot","center":[-2.6322,-2.6464,-2.637],"unit":12.7848,"fit":1.0458,"seeds":[[-4.9738,-1.692,0.8231],[-4.0859,0.6791,-6.005],[-0.2122,-5.9494,-7.5107],[-2.0711,-11.4075,-4.0866],[-10.8647,-8.9362,4.7396],[-7.9718,6.1511,-5.7216],[4.4674,-2.3333,-5.7034],[-0.6306,-4.4267,2.7939],[-3.9527,1.4746,0.2572],[0.2693,0.6939,-4.0613],[0.8263,-4.7113,-1.1925],[-5.7482,-3.3362,0.7454],[-6.4742,0.2046,-6.2109],[-2.6207,-3.6566,-10.4596],[3.1608,-11.797,-8.119],[-7.065,-8.606,6.3178],[-6.2343,4.9761,-3.0387],[3.2103,-0.9889,-4.6805],[0.0692,-4.0191,1.8095],[-3.978,0.606,0.6095],[-0.7443,0.8145,-4.482],[0.7874,-5.4584,-2.6622],[-6.2534,-5.5132,0.4601],[-9.3622,-1.4568,-4.834]]},{"key":"thomas","count":800,"at":[0.205,0.775],"radius":0.125,"h":0.012,"sub":2,"hue":"paper","center":[1.9584,1.8288,1.8697],"unit":4.2322,"fit":1.0613,"seeds":[[2.4938,2.4287,2.8387],[-0.7044,0.5518,0.4876],[1.3086,2.7343,3.1872],[2.4151,2.5018,2.8257],[-1.1087,0.135,1.0575],[2.0414,3.1984,2.4366],[0.412,-0.3683,0.7281],[3.5162,1.6552,1.8349],[2.6366,2.469,2.6587],[0.4097,3.5814,2.4547],[2.2602,2.5299,2.9514],[0.7287,0.3989,0.6236],[1.0782,3.6957,2.3516],[2.2006,2.6959,2.8461],[0.5208,0.0194,0.1495],[2.2587,3.4104,1.7287]]},{"key":"rossler","count":800,"at":[0.795,0.225],"radius":0.105,"h":0.016,"sub":2,"hue":"steel","center":[0.1758,-0.8883,0.8923],"unit":22.7436,"fit":1.9888,"seeds":[[-8.4489,-2.8006,0.014],[10.4244,-0.9664,9.5357],[-1.8205,-2.6518,0.0256],[3.5088,2.1994,0.1059],[-5.4778,-1.1,0.0178],[7.4336,-1.3239,0.3681],[-8.2061,3.725,0.0147],[8.777,-8.2993,0.2293],[-2.5679,-0.9154,0.0241],[3.6921,-0.1816,0.0836],[-4.6104,1.7938,0.0198],[5.0717,-4.3351,0.0912],[-4.4341,6.762,0.022],[2.5673,-10.1647,0.0416],[-2.8528,2.1939,0.0496],[2.6458,-3.9982,0.0507],[-1.5564,5.7289,0.0333],[-0.6472,-7.6045,0.0276],[1.4844,6.6488,1.708],[-4.6095,-7.4916,0.0183],[1.3157,3.4245,8.4163],[-1.5107,-4.4636,0.0259],[3.8225,4.397,0.2409],[-6.8524,-3.5935,0.0156]]}];

  const canvas = document.getElementById('chaos');
  const ctx = canvas.getContext('2d', { alpha: true });
  const needle = document.getElementById('needle');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

  // ── 4つの系の微分方程式 ──
  const DERIV = {
    lorenz: (x, y, z, o) => { o[0] = 10*(y-x); o[1] = x*(28-z)-y; o[2] = x*y-(8/3)*z; },
    halvorsen: (x, y, z, o) => { o[0] = -1.89*x-4*y-4*z-y*y; o[1] = -1.89*y-4*z-4*x-z*z; o[2] = -1.89*z-4*x-4*y-x*x; },
    thomas: (x, y, z, o) => { o[0] = Math.sin(y)-0.1998*x; o[1] = Math.sin(z)-0.1998*y; o[2] = Math.sin(x)-0.1998*z; },
    rossler: (x, y, z, o) => { o[0] = -y-z; o[1] = x+0.2*y; o[2] = 0.2+z*(x-5.7); }
  };

  const k1 = [0,0,0], k2 = [0,0,0], k3 = [0,0,0], k4 = [0,0,0];
  function step(f, st, h) {
    f(st[0], st[1], st[2], k1);
    f(st[0]+h*.5*k1[0], st[1]+h*.5*k1[1], st[2]+h*.5*k1[2], k2);
    f(st[0]+h*.5*k2[0], st[1]+h*.5*k2[1], st[2]+h*.5*k2[2], k3);
    f(st[0]+h*k3[0], st[1]+h*k3[1], st[2]+h*k3[2], k4);
    st[0] += h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]);
    st[1] += h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    st[2] += h/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2]);
  }

  // ── 各系の粒子を、軌道上の種点から少しずつずらして配置 ──
  const groups = SYSTEMS.map(cfg => {
    const f = DERIV[cfg.key];
    const seeds = cfg.seeds;
    const particles = [];
    for (let i = 0; i < cfg.count; i++) {
      const s = seeds[i % seeds.length];
      const j = (i / seeds.length) | 0;
      const e = 1e-4 * (1 + (j % 17));
      particles.push({
        st: [s[0] + e*j, s[1] - e*(j % 5), s[2] + e*(j % 3)],
        x: 0, y: 0, seeded: false
      });
    }
    return { cfg, f, particles, cos: 1, sin: 0, cosP: 1, sinP: 0, scale: 1, cx: 0, cy: 0 };
  });

  let W = 0, H = 0, dpr = 1;
  let raf = 0, prev = 0, elapsed = 0, last = 0;
  const FRAME = 1000 / 30;
  const tone = [
    'rgba(232,181,42,',
    'rgba(255,92,51,',
    'rgba(126,196,214,',
    'rgba(243,232,201,'
  ];

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.round(W*dpr));
    canvas.height = Math.max(1, Math.round(H*dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const min = Math.min(W, H);
    for (const g of groups) {
      g.cx = g.cfg.at[0]*W;
      g.cy = g.cfg.at[1]*H;
      g.scale = min * g.cfg.radius * g.cfg.fit;
      for (const p of g.particles) p.seeded = false;
    }
    paint(0, 0);
  }

  function paint(dt, time) {
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    const yaw = time * 0.0000455;
    const pitch = 0.34 + Math.sin(time * 0.00021) * 0.16;
    const ca = Math.cos(yaw), sa = Math.sin(yaw);
    const cb = Math.cos(pitch), sb = Math.sin(pitch);

    for (let gi = 0; gi < groups.length; gi++) {
      const g = groups[gi];
      const cfg = g.cfg;
      const h = cfg.h, sub = cfg.sub;
      const ox = cfg.center[0], oy = cfg.center[1], oz = cfg.center[2], unit = cfg.unit;
      const sc = g.scale, cx = g.cx, cy = g.cy;
      const sx = 1 / unit;
      const ps = g.particles;

      // 軌道を進める
      for (let i = 0; i < ps.length; i++) {
        const st = ps[i].st;
        for (let k = 0; k < sub; k++) step(g.f, st, h);
        if (Math.abs(st[0]) > 1e4 || Math.abs(st[1]) > 1e4 || Math.abs(st[2]) > 1e4) {
          const s = cfg.seeds[i % cfg.seeds.length];
          st[0] = s[0]; st[1] = s[1]; st[2] = s[2];
        }
      }

      // 投影して、軌跡（尾）と頭をまとめて描く
      ctx.strokeStyle = tone[gi % 4] + '0.30)';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i], st = p.st;
        const x = (st[0]-ox)*sx, y = (st[1]-oy)*sx, z = (st[2]-oz)*sx;
        const X = x*ca - y*sa;
        const Y = (x*sa + y*ca)*cb - z*sb;
        const px = cx + X*sc;
        const py = cy - Y*sc;
        if (p.seeded) { ctx.moveTo(p.x, p.y); ctx.lineTo(px, py); }
        p.x = px; p.y = py; p.seeded = true;
      }
      ctx.stroke();

      ctx.fillStyle = tone[gi % 4] + '0.62)';
      ctx.beginPath();
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        ctx.moveTo(p.x + 0.55, p.y);
        ctx.arc(p.x, p.y, 0.55, 0, 6.2832);
      }
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    // 針はローレンツの x をそのまま角度に写す
    if (needle) {
      const st = groups[0].particles[0].st;
      const a = Math.max(-1, Math.min(1, st[0] / 18)) * 46;
      needle.style.transform = 'rotate(' + a.toFixed(2) + 'deg)';
    }
  }

  function loop(now) {
    raf = 0;
    if (document.hidden || reduced.matches) return;
    if (!prev) prev = now;
    const dt = Math.min(now - prev, 68);
    prev = now;
    elapsed += dt;
    if (now - last >= FRAME) { paint(dt, elapsed); last = now; }
    raf = requestAnimationFrame(loop);
  }
  function start() {
    if (document.hidden || reduced.matches || raf) return;
    prev = 0; last = 0;
    raf = requestAnimationFrame(loop);
  }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => {
    const hidden = document.hidden;
    document.documentElement.classList.toggle('is-paused', hidden);
    if (hidden) stop(); else start();
  });
  if (reduced.addEventListener) {
    reduced.addEventListener('change', () => {
      if (reduced.matches) { stop(); paint(0, elapsed); } else start();
    });
  }
  resize();
  start();
})();
