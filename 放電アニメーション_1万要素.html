<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080a">
  <meta name="description" content="一万を超える要素が同時に動き続ける、放電モチーフの全画面アニメーション。">
  <title>放電アニメーション 1万要素</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #05080a;
      --night: #0a1012;
      --steel: #9eaaa4;
      --steel-rgb: 158,170,164;
      --paper: #f3e8c9;
      --amber: #e8b52a;
      --amber-rgb: 232,181,42;
      --hot: #ff5c33;
      --hot-rgb: 255,92,51;
      --hair: rgba(158,170,164,.30);
      --measure: min(118vmin, 100rem);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--void);
      color: var(--paper);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sr-only {
      position: absolute !important;
      width: 1px !important; height: 1px !important;
      padding: 0 !important; margin: -1px !important;
      overflow: hidden !important; clip: rect(0,0,0,0) !important;
      white-space: nowrap !important; border: 0 !important;
    }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(var(--amber-rgb),.11) 0, rgba(var(--hot-rgb),.04) 17%, transparent 44%),
        radial-gradient(ellipse at 50% 54%, #0b1112 0, var(--void) 74%);
    }
    .stage::before, .stage::after { position: absolute; inset: 0; pointer-events: none; content: ""; }
    .stage::before {
      z-index: 20;
      opacity: .17;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(243,232,201,.075) 3px 4px);
      mix-blend-mode: screen;
    }
    .stage::after {
      z-index: 21;
      background: radial-gradient(ellipse at center, transparent 27%, rgba(5,8,10,.42) 71%, rgba(5,8,10,.94) 122%);
    }

    /* ── 3200 セルの格子面 ── */
    .lattice {
      position: absolute;
      z-index: 0;
      inset: -12%;
      display: grid;
      grid-template-columns: repeat(80, 1fr);
      grid-template-rows: repeat(40, 1fr);
      gap: .5px;
      opacity: .30;
      mask-image: radial-gradient(ellipse at center, #000 8%, rgba(0,0,0,.55) 48%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 8%, rgba(0,0,0,.55) 48%, transparent 78%);
    }
    .lattice i {
      display: block;
      opacity: var(--o);
      background: linear-gradient(150deg, rgba(var(--amber-rgb),.5), rgba(var(--hot-rgb),.10) 58%, transparent);
      animation: cell-flicker var(--t) steps(2, end) infinite;
      animation-delay: calc(var(--d) * -1);
    }
    .lattice i:nth-child(7n) { background: linear-gradient(150deg, rgba(var(--hot-rgb),.55), transparent 70%); }

    .field-grid {
      position: absolute;
      z-index: 1;
      inset: -20%;
      opacity: .16;
      background-image:
        linear-gradient(rgba(var(--steel-rgb),.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--steel-rgb),.085) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse at center, #000 0, transparent 66%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0, transparent 66%);
      animation: grid-drift 34s linear infinite;
    }
    .scan-sweep {
      position: absolute;
      z-index: 6;
      inset: -50% -15%;
      opacity: .21;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 45%, rgba(var(--amber-rgb),.11) 49.6%, rgba(var(--hot-rgb),.26) 50%, rgba(var(--amber-rgb),.09) 50.4%, transparent 55%);
      transform: translateY(-80%);
      animation: scan 7.4s cubic-bezier(.55,0,.45,1) infinite;
    }
    #sparks { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ── 中心儀 ── */
    .core {
      position: absolute;
      z-index: 4;
      left: 50%; top: 50%;
      width: var(--measure);
      aspect-ratio: 1;
      transform: translate(-50%,-50%);
    }
    .core-glow {
      position: absolute; inset: 6%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--hot-rgb),.09) 0, rgba(var(--amber-rgb),.06) 30%, transparent 68%);
      filter: blur(14px);
      animation: breathe 4.1s ease-in-out infinite alternate;
    }
    .beamfield {
      position: absolute; inset: -12%;
      border-radius: 50%;
      opacity: .30;
      background: repeating-conic-gradient(from 0deg,
        transparent 0deg 2.9deg,
        rgba(var(--amber-rgb),.17) 3deg 3.12deg,
        transparent 3.3deg 5.8deg,
        rgba(var(--hot-rgb),.12) 5.9deg 6deg,
        transparent 6.2deg 8.7deg);
      mask-image: radial-gradient(circle, transparent 0 30%, #000 38%, #000 55%, transparent 74%);
      -webkit-mask-image: radial-gradient(circle, transparent 0 30%, #000 38%, #000 55%, transparent 74%);
      animation: spin-cw 27s linear infinite;
      mix-blend-mode: screen;
    }
    .beamfield--inner {
      inset: 12%;
      opacity: .27;
      background: repeating-conic-gradient(from 7deg,
        transparent 0deg 5deg,
        rgba(var(--hot-rgb),.20) 5.1deg 5.24deg,
        transparent 5.4deg 10.4deg);
      mask-image: radial-gradient(circle, transparent 0 40%, #000 43%, #000 68%, transparent 76%);
      -webkit-mask-image: radial-gradient(circle, transparent 0 40%, #000 43%, #000 68%, transparent 76%);
      animation: spin-ccw 19s linear infinite;
    }
    .instrument {
      position: absolute; inset: 0;
      display: block; width: 100%; height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 20px rgba(var(--amber-rgb),.15));
    }
    .rot { transform-box: view-box; transform-origin: 300px 300px; }
    .rot--a { animation: spin-cw 82s linear infinite; }
    .rot--b { animation: spin-ccw 53s linear infinite; }
    .rot--c { animation: spin-cw 34s linear infinite; }
    .rot--d { animation: spin-ccw 22s linear infinite; }
    .hair { fill: none; stroke: rgba(var(--steel-rgb),.32); stroke-width: .55; }
    .hair--hot { stroke: rgba(var(--hot-rgb),.40); stroke-width: .8; }
    .dash { fill: none; stroke: rgba(var(--amber-rgb),.34); stroke-width: .7; stroke-dasharray: 1 5; }
    .tk { stroke: rgba(var(--steel-rgb),.30); stroke-width: .6; }
    .tk--ultra { stroke: rgba(var(--steel-rgb),.22); stroke-width: .45; }
    .tk--ultra2 { stroke: rgba(var(--amber-rgb),.55); stroke-width: .8; }
    .tk--fine { stroke: rgba(var(--steel-rgb),.28); stroke-width: .55; }
    .tk--thin { stroke: rgba(var(--steel-rgb),.34); stroke-width: .6; }
    .tk--mid { stroke: rgba(var(--paper),.68); stroke-width: .95; }
    .tk--inner { stroke: rgba(var(--amber-rgb),.60); stroke-width: .8; }
    .tk--arm { stroke: rgba(var(--hot-rgb),.78); }
    .tk--arm2 { stroke: rgba(var(--amber-rgb),.58); }
    .band { fill: none; stroke: rgba(var(--hot-rgb),.22); stroke-width: 8; }
    .band-thin { fill: none; stroke: rgba(var(--hot-rgb),.86); stroke-width: .9; }
    .hatch { stroke: rgba(var(--hot-rgb),.82); stroke-width: 1.2; }
    .arc-seg { fill: none; stroke: rgba(var(--amber-rgb),.68); stroke-width: 1; stroke-linecap: round; }
    .arc-tick { fill: none; stroke: rgba(var(--paper),.48); stroke-width: .55; }
    .dust { animation: dust-pulse 6.2s ease-in-out infinite alternate; }
    .dust circle { opacity: .55; }
    .dust--steel { fill: var(--steel); opacity: .40; }
    .dust--paper { fill: var(--paper); opacity: .55; }
    .dust--hot { fill: var(--hot); opacity: .78; }
    .lens { fill: rgba(5,8,10,.76); stroke: rgba(var(--amber-rgb),.55); stroke-width: 1.2; }
    .lens--thin { fill: none; stroke: rgba(var(--hot-rgb),.46); stroke-width: .7; stroke-dasharray: 2 4; }
    .needle { transform-box: view-box; transform-origin: 300px 300px; animation: needle-sweep 2.4s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .needle-fill { fill: var(--paper); stroke: var(--hot); stroke-width: .7; filter: drop-shadow(0 0 6px rgba(var(--hot-rgb),.85)); }
    .needle-tail { fill: var(--hot); opacity: .7; }
    .hub-ring { fill: var(--void); stroke: var(--amber); stroke-width: 1.4; }
    .hub { fill: var(--paper); }

    /* ── 480 本の光条 ── */
    .spectrum { position: absolute; inset: -6%; z-index: 3; pointer-events: none; }
    .spectrum i {
      position: absolute;
      top: 50%; left: 50%;
      display: block;
      width: 1px;
      height: var(--h);
      transform: translate(-50%,-50%) rotate(var(--a));
      transform-origin: center;
      background: linear-gradient(180deg, transparent 0, rgba(var(--amber-rgb),.75) 44%, rgba(var(--hot-rgb),.55) 56%, transparent 100%);
      opacity: .38;
      animation: sliver var(--t) ease-in-out infinite alternate;
      animation-delay: calc(var(--d) * -1);
    }

    /* ── 400 本の放射ブレード ── */
    .blades { position: absolute; inset: 0; z-index: 3; pointer-events: none; animation: blade-turn 44s linear infinite; }
    .blades i {
      position: absolute;
      top: 50%; left: 50%;
      display: block;
      width: 1px;
      height: var(--h);
      transform: translate(-50%,-100%) rotate(var(--a));
      transform-origin: center bottom;
      background: linear-gradient(180deg, transparent 0, rgba(var(--hot-rgb),.42) 62%, rgba(var(--paper),.55) 97%, transparent 100%);
      opacity: .30;
      animation: blade-pulse var(--t) ease-in-out infinite alternate;
      animation-delay: calc(var(--t) * -.46);
    }

    /* ── 周回軌道 6 基 ── */
    .orbits { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .orbits i {
      position: absolute;
      top: 50%; left: 50%;
      display: block;
      width: calc(var(--r) * 2);
      height: calc(var(--r) * .74);
      border: 1px solid rgba(var(--steel-rgb),.16);
      border-radius: 50%;
      transform: translate(-50%,-50%) rotate(-31deg);
      animation: orbit-spin var(--spin) linear infinite var(--dir);
    }
    .orbits i:nth-child(2n) { border-color: rgba(var(--amber-rgb),.18); }
    .orbits i:nth-child(3n) { border-style: dashed; border-color: rgba(var(--hot-rgb),.20); }
    .orbits i::before, .orbits i::after {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      content: "";
      background: var(--paper);
      box-shadow: 0 0 9px 2px rgba(var(--amber-rgb),.72);
    }
    .orbits i::before { top: -3px; left: 50%; }
    .orbits i::after { right: 12%; bottom: 4%; width: 3px; height: 3px; background: var(--hot); box-shadow: 0 0 8px 2px rgba(var(--hot-rgb),.7); }

    /* ── 左右の 800 セル・バー列 ── */
    .columns {
      position: absolute;
      z-index: 7;
      display: flex;
      gap: clamp(1px,.16vw,3px);
      width: clamp(4rem, 10vw, 9rem);
      height: 62vh;
      opacity: .38;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .columns--left { left: clamp(.5rem,2.4vw,2.5rem); top: 19vh; }
    .columns--right { right: clamp(.5rem,2.4vw,2.5rem); bottom: 19vh; transform: rotate(180deg); opacity: .26; }
    .col { display: flex; flex: 1; min-width: 0; height: 100%; flex-direction: column; gap: 1px; }
    .col i { position: relative; display: block; flex: 1; min-height: 1px; overflow: hidden; }
    .col i::before {
      position: absolute;
      top: 0; left: 0;
      display: block;
      width: var(--h);
      height: 100%;
      content: "";
      background: linear-gradient(90deg, rgba(var(--amber-rgb),.95), rgba(var(--hot-rgb),.55));
      opacity: .3;
      transform-origin: left center;
      animation: bar-flare var(--t) ease-in-out infinite alternate;
      animation-delay: calc(var(--d) * -1);
    }
    .columns--right .col i::before { left: auto; right: 0; transform-origin: right center; }

    @keyframes spin-cw { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(-31deg); }
      to { transform: translate(-50%,-50%) rotate(329deg); }
    }
    @keyframes needle-sweep { from { transform: rotate(-41deg); } to { transform: rotate(41deg); } }
    @keyframes blade-turn { to { transform: rotate(360deg); } }
    @keyframes blade-pulse {
      from { opacity: .06; transform: translate(-50%,-100%) rotate(var(--a)) scaleY(.52); }
      to { opacity: .56; transform: translate(-50%,-100%) rotate(var(--a)) scaleY(1.04); }
    }
    @keyframes sliver {
      from { opacity: .08; transform: translate(-50%,-50%) rotate(var(--a)) scaleY(.42); }
      to { opacity: .62; transform: translate(-50%,-50%) rotate(var(--a)) scaleY(1.12); }
    }
    @keyframes bar-flare { from { opacity: .07; transform: scaleX(.18); } to { opacity: .62; transform: scaleX(1); } }
    @keyframes cell-flicker { from { opacity: calc(var(--o) * .25); } to { opacity: var(--o); } }
    @keyframes dust-pulse { from { opacity: .48; } to { opacity: 1; } }
    @keyframes breathe { from { opacity: .5; transform: scale(.9); } to { opacity: 1; transform: scale(1.08); } }
    @keyframes grid-drift { from { transform: rotate(0deg) translate3d(0,0,0); } to { transform: rotate(6deg) translate3d(26px,16px,0); } }
    @keyframes scan { 0% { transform: translateY(-80%); } 50% { transform: translateY(0); } 100% { transform: translateY(80%); } }

    .is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

    @media (max-width: 40rem) {
      :root { --measure: min(140vmin, 100rem); }
      .columns { width: 3rem; height: 52vh; opacity: .26; }
      .columns--left { left: .2rem; top: 24vh; }
      .columns--right { right: .2rem; bottom: 24vh; }
      .lattice { opacity: .22; }
      .beamfield { opacity: .20; }
      .beamfield--inner { opacity: .17; }
      .spectrum i { opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        animation-play-state: paused !important;
      }
      .scan-sweep, #sparks { display: none; }
    }
    @media print {
      body, .stage { background: var(--void); }
      .stage { position: relative; width: 100vw; height: 100vh; }
      #sparks, .scan-sweep { display: none; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('sparks');
      const ctx = canvas.getContext('2d', { alpha: true });
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TONES = ['232,181,42', '255,92,51', '243,232,201', '158,170,164'];
      const COUNT = 620;
      const particles = [];
      for (let i = 0; i < COUNT; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          radius: .08 + Math.random() * .62,
          speed: .1 + Math.random() * .58,
          drift: (Math.random() - .5) * .02,
          size: .4 + Math.random() * 2.1,
          phase: Math.random() * Math.PI * 2,
          tone: i % 9 === 0 ? 1 : (i % 4 === 0 ? 2 : (i % 3 === 0 ? 3 : 0)),
          x: 0,
          y: 0
        });
      }
      let width = 0, height = 0, dpr = 1;
      let raf = 0, previous = 0, elapsed = 0, lastPaint = 0;
      const frameInterval = 1000 / 30;

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        for (const p of particles) { p.x = 0; p.y = 0; }
        paint(0, 0);
      }

      function paint(dt, time) {
        if (!width || !height) return;
        ctx.clearRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';
        const cx = width * .5;
        const cy = height * .5;
        const span = Math.min(width, height) * .6;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.angle += dt * .00004 * p.speed;
          p.radius += p.drift * dt * .00004;
          if (p.radius < .06) p.radius = .70;
          if (p.radius > .72) p.radius = .09;
          const pulse = .5 + .5 * Math.sin(time * .0014 + p.phase);
          const rx = span * p.radius;
          const x = cx + Math.cos(p.angle) * rx;
          const y = cy + Math.sin(p.angle) * rx * .74;
          const color = TONES[p.tone];
          const alpha = .18 + pulse * (p.tone === 1 ? .64 : .40);
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = 'rgba(' + color + ',' + alpha + ')';
          ctx.lineWidth = p.size * (p.tone === 1 ? 1.4 : .7);
          ctx.beginPath();
          ctx.moveTo(p.x || x, p.y || y);
          ctx.lineTo(x, y);
          ctx.stroke();
          ctx.fillStyle = 'rgba(' + color + ',' + alpha + ')';
          ctx.beginPath();
          ctx.arc(x, y, p.size * (p.tone === 1 ? 1.4 : 1), 0, Math.PI * 2);
          ctx.fill();
          p.x = x;
          p.y = y;
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      function loop(now) {
        raf = 0;
        if (document.hidden || motion.matches) return;
        if (!previous) previous = now;
        const dt = Math.min(now - previous, 70);
        previous = now;
        elapsed += dt;
        if (now - lastPaint >= frameInterval) {
          paint(dt, elapsed);
          lastPaint = now;
        }
        raf = requestAnimationFrame(loop);
      }

      function start() {
        if (document.hidden || motion.matches || raf) return;
        previous = 0;
        lastPaint = 0;
        raf = requestAnimationFrame(loop);
      }
      function stop() {
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
      }

      window.addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => {
        const hidden = document.hidden;
        document.documentElement.classList.toggle('is-paused', hidden);
        if (hidden) stop();
        else start();
      });
      if (motion.addEventListener) {
        motion.addEventListener('change', () => {
          if (motion.matches) {
            stop();
            paint(0, elapsed);
          } else {
            start();
          }
        });
      }
      resize();
      start();
    })();
